<div class="panel">
    <img src="../img/mosaic-icon.svg" class="logo"></img>

    <dl>
        <dt ng-click="open.text=!open.text"><i class="fa fa-chevron-right" ng-class="{'fa-chevron-down': open.text}"></i> Text</dt>
<dd ng-show="open.text">
        <h4>Title:</h4>
        <input type="text" ng-model="tpl_html_title">

        <h4>Body:</h4>
        <textarea ng-model="tpl_body_text"></textarea>
</dd>
    </dl>

    <dl>
        <dt ng-click="open.meta=!open.meta"><i class="fa fa-chevron-right" ng-class="{'fa-chevron-down': open.meta}"></i> Meta/Head</dt>
        <dd ng-show="open.meta">
        <h4>Description:</h4>
        <input type="text" ng-model="tpl_meta_description">

        <h4>&lt;body&gt; classes:</h4>
        <input type="text" ng-model="tpl_tag_body_classes">

        <h4>Meta tags:</h4>

        <p ng-repeat="meta in libs | filter: { type: 'meta' } track by $index">
            <button class="{{ meta.name | noSpace }}" ng-click="useScript(meta.name)">add <i class="fa fa-plus"></i>
            </button>
            {{meta.name}}
        </p>
        </dd>
    </dl>

    <dl>
        <dt ng-click="open.scripts=!open.scripts"><i class="fa fa-chevron-right" ng-class="{'fa-chevron-down': open.scripts}"></i> Frameworks</dt>
        <dd ng-show="open.scripts">

        <h4>USE:</h4>

        <input type="text" ng-model="search_libs" placeholder="Search libraries"
               title="You can type 'css' or 'js' to filter by script type type">

        <p ng-repeat="lib in libs | orderBy: ['-type','name'] | filter: search_libs | filter: { type: '!meta' } track by lib.name">
            <button class="{{ lib.name | noSpace }}" ng-click="useScript(lib.name)">add <i class="fa fa-plus"></i>
            </button>
            <b>{{lib.type | uppercase}}</b> {{lib.name}}
        </p>
        </dd>
    </dl>

    <dl>
        <dt ng-click="open.bundles=!open.bundles"><i class="fa fa-chevron-right" ng-class="{'fa-chevron-down': open.bundles}"></i> Bundles</dt>
        <dd ng-show="open.bundles">
        <p><button ng-click="bundle('jQuery-v2+AngularJs+AngularJs-route+AngularJs-resource+AngularJs-animate+AngularJs-cookies+AngularJs-sanitize+AngularJs-csp+Local-CSS-file+Local-Javascript-file')">use <i class="fa fa-plus"></i></button> AngularJs</p>
        <p><button ng-click="bundle('jQuery-v2+Ember+Ember-data+Local-CSS-file+Local-Javascript-file')">use <i class="fa fa-plus"></i></button> Ember Js</p>
        <p><button ng-click="bundle('React+JSXTransformer+Local-CSS-file+Local-Javascript-file')">use <i class="fa fa-plus"></i></button> React</p>
        <p><button ng-click="bundle('jQuery-v1+jQuery-migrate')">use <i class="fa fa-plus"></i></button> jQuery w/migrate</p>
        <p><button ng-click="bundle('jQuery-v2+Twitter-Bootstrap-CSS+Twitter-Bootstrap-JS')">use <i class="fa fa-plus"></i></button> Twitter Bootstrap</p>
        <p><button ng-click="bundle('View-Port+Normalize+Zurb-Foundation-CSS+Local+CSS+file+Modernizr+jQuery-v2+Fastclick-JS+Zurb-Foundation-JS')">use <i class="fa fa-plus"></i></button> Zurb Foundation</p>
        </dd>
    </dl>


</div>
<div class="content">
    <h1>{{welcome}}</h1>

    <tpl-code></tpl-code>

</div>
